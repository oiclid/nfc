name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller nfc.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc installer.iss

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Cooperative-Installer
          path: dist\installer\NFC-Cooperative-Setup-v2.0.0.exe

      - name: Attach installer to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist\installer\NFC-Cooperative-Setup-v2.0.0.exe
          asset_name: NFC-Cooperative-Setup-v2.0.0.exe
          asset_content_type: application/octet-stream
