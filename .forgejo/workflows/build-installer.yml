name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate seed database
        run: python migrations/migrate.py

      - name: Build with PyInstaller
        run: pyinstaller NFC-Cooperative.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc installer.iss

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Cooperative-Installer
          path: dist\installer\NFC-Cooperative-Setup-v2.0.0.exe

      - name: Attach installer to release
        uses: forgejo/release-action@v1
        with:
          direction: upload
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          release-dir: dist/installer
          release-notes: "Windows installer built automatically from tag ${{ github.ref_name }}."